<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红果广告跳过 · 云端后台</title>
<style>
  :root { --line:#e3e6ea; --txt:#222; --sub:#777; --main:#e0503c; --bg:#f5f6f8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin:16px 0; }
  h1 { font-size:20px; margin-bottom:4px; }
  h2 { font-size:16px; margin-bottom:12px; }
  .sub { color:var(--sub); font-size:12px; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px; }
  input,button,select { font-size:14px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  input { width:100%; }
  button { background:var(--main); color:#fff; border:none; cursor:pointer; padding:8px 16px; }
  button.ghost { background:#fff; color:var(--txt); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:6px; margin:14px 0; flex-wrap:wrap; }
  .tabs button { background:#fff; color:var(--txt); border:1px solid var(--line); }
  .tabs button.on { background:var(--main); color:#fff; border-color:var(--main); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:normal; }
  .msg { padding:8px 10px; border-radius:6px; font-size:13px; margin:8px 0; }
  .msg.err { background:#fdeceb; color:#b3261e; }
  .msg.ok { background:#e6f4ea; color:#137333; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; }
  .stat { flex:1; min-width:140px; background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .stat b { font-size:26px; display:block; }
  pre { background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-all; font-size:12.5px; }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:6px; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; background:#eee; }
  .badge.admin { background:#fde8d7; color:#a0410d; }
  .badge.on { background:#e6f4ea; color:#137333; }
  .pager { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录/注册 -->
  <div id="authBox" class="card">
    <h1>红果广告跳过 · 云端后台</h1>
    <div class="sub">App 缺陷报告 · 版本发布 · 用户管理</div>
    <div class="tabs">
      <button id="tabLogin" class="on" onclick="switchAuth('login')">登录</button>
      <button id="tabReg" onclick="switchAuth('reg')">注册</button>
    </div>
    <div id="msgAuth" class="msg err hidden"></div>
    <div class="row"><input id="aEmail" placeholder="邮箱" autocomplete="username"></div>
    <div class="row"><input id="aPass" type="password" placeholder="密码（至少8位）" autocomplete="current-password"></div>
    <div class="row hidden" id="rowCode"><input id="aCode" placeholder="邮箱验证码"></div>
    <div class="row">
      <button id="btnSendCode" class="ghost hidden" onclick="sendCode()">发送验证码</button>
      <button id="btnAuth" onclick="doAuth()">登录</button>
    </div>
    <div class="sub">验证码邮件发送失败或未配置 SMTP 时，可直接注册（仅邮箱+密码）。</div>
  </div>

  <!-- 主界面 -->
  <div id="mainBox" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><h1>红果广告跳过 · 云端后台</h1><div class="sub" id="whoami"></div></div>
        <button class="ghost" onclick="logout()">退出</button>
      </div>
      <div class="tabs">
        <button id="t-overview" class="on" onclick="switchTab('overview')">概览</button>
        <button id="t-reports" onclick="switchTab('reports')">缺陷报告</button>
        <button id="t-versions" onclick="switchTab('versions')">版本发布</button>
        <button id="t-users" onclick="switchTab('users')">用户</button>
      </div>
      <div id="msgMain" class="msg err hidden"></div>

      <div id="p-overview"><div class="stats" id="stats"></div></div>

      <div id="p-reports" class="hidden">
        <div class="row">
          <input id="rq" placeholder="搜索报告内容…" style="flex:1">
          <button onclick="loadReports(1)">搜索</button>
        </div>
        <table id="rTable"><thead><tr><th>时间</th><th>版本</th><th>来源IP</th><th>摘要</th><th></th></tr></thead><tbody></tbody></table>
        <div class="pager">
          <button class="ghost" onclick="pageReports(-1)">上一页</button>
          <span id="rPage"></span>
          <button class="ghost" onclick="pageReports(1)">下一页</button>
        </div>
      </div>

      <div id="p-versions" class="hidden">
        <h2>上传新版本</h2>
        <div class="row"><input id="vVer" placeholder="版本号，如 1.35" style="width:160px"><input id="vNote" placeholder="更新说明（可选）"></div>
        <div class="row"><input type="file" id="vFile" accept=".apk"></div>
        <div class="row"><button onclick="uploadVersion()">上传</button><span class="sub" id="vUp"></span></div>
        <h2 style="margin-top:18px">版本列表</h2>
        <table id="vTable"><thead><tr><th>版本</th><th>说明</th><th>大小</th><th>时间</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>
      </div>

      <div id="p-users" class="hidden">
        <h2>用户列表</h2>
        <table id="uTable"><thead><tr><th>邮箱</th><th>角色</th><th>注册时间</th><th>状态</th><th></th></tr></thead><tbody></tbody></table>
        <h2 style="margin-top:18px">修改我的密码</h2>
        <div class="row"><input id="pOld" type="password" placeholder="当前密码" style="flex:1"><input id="pNew" type="password" placeholder="新密码（至少8位）" style="flex:1"><button onclick="changePw()">修改</button></div>
      </div>
    </div>

    <!-- 报告详情 -->
    <div id="detailBox" class="card hidden">
      <div class="row" style="justify-content:space-between"><h2 id="dTitle"></h2><button class="ghost" onclick="hideDetail()">返回列表</button></div>
      <div id="dShot"></div>
      <pre id="dText"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('hg_token') || '';
let rPageNow = 1;

function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }
function showMsg(box, text, ok) {
  const el = $(box);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
async function api(path, opts) {
  const o = opts || {};
  o.headers = Object.assign({}, o.headers || {}, authHeaders());
  const r = await fetch(path, o);
  let j = null;
  try { j = await r.json(); } catch (_) {}
  if (r.status === 401 && path !== '/api/auth/login') { logout(true); throw new Error('登录已过期，请重新登录'); }
  return { status: r.status, data: j || {} };
}

/* ---------- 认证 ---------- */
let authMode = 'login';
let codeRequired = false;

async function initAuth() {
  const r = await fetch('/api/config');
  const j = await r.json();
  codeRequired = !!j.codeRequired;
}
function switchAuth(m) {
  authMode = m;
  $('tabLogin').className = m === 'login' ? 'on' : '';
  $('tabReg').className = m === 'reg' ? 'on' : '';
  $('btnAuth').textContent = m === 'login' ? '登录' : '注册';
  $('rowCode').className = 'row' + (m === 'reg' && codeRequired ? '' : ' hidden');
  $('btnSendCode').className = 'ghost' + (m === 'reg' && codeRequired ? '' : ' hidden');
}
async function sendCode() {
  const email = $('aEmail').value.trim();
  if (!email) { showMsg('msgAuth', '请先填邮箱', false); return; }
  $('btnSendCode').disabled = true;
  const r = await api('/api/auth/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  $('btnSendCode').disabled = false;
  if (r.data.ok) {
    showMsg('msgAuth', '验证码已发送，请查收（60秒内勿重复发送）', true);
    let s = 60;
    const t = setInterval(() => { $('btnSendCode').textContent = s-- + 's'; if (s <= 0) { clearInterval(t); $('btnSendCode').textContent = '发送验证码'; } }, 1000);
  } else {
    showMsg('msgAuth', '发送失败：' + (r.data.error || r.status) + '，可直接注册（不填验证码）', false);
  }
}
async function doAuth() {
  const email = $('aEmail').value.trim();
  const pass = $('aPass').value;
  if (!email || !pass) { showMsg('msgAuth', '请填邮箱和密码', false); return; }
  const body = { email, password: pass };
  if (authMode === 'reg') body.code = $('aCode').value.trim();
  const r = await api('/api/auth/' + authMode, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.data.ok && r.data.token) {
    token = r.data.token;
    localStorage.setItem('hg_token', token);
    enterMain();
  } else {
    const map = { email_taken: '该邮箱已注册，请直接登录', bad_code: '验证码错误或已过期', bad_email_or_password: '邮箱格式或密码（至少8位）不合法', invalid: '邮箱或密码不正确', disabled: '账号已被停用', too_many: '操作太频繁，稍后再试' };
    showMsg('msgAuth', map[r.data.error] || ('失败：' + (r.data.error || r.status)), false);
  }
}
async function logout(expired) {
  if (!expired) await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  token = '';
  localStorage.removeItem('hg_token');
  $('mainBox').className = 'hidden';
  $('authBox').className = 'card';
  if (expired) showMsg('msgAuth', '登录已过期，请重新登录', false);
}

/* ---------- 主界面 ---------- */
async function enterMain() {
  $('authBox').className = 'hidden';
  $('mainBox').className = '';
  const r = await api('/api/auth/me');
  $('whoami').textContent = r.data.email + (r.data.role === 'admin' ? ' · 管理员' : ' · 普通用户');
  const isAdmin = r.data.role === 'admin';
  $('t-versions').style.display = isAdmin ? '' : 'none';
  $('t-users').style.display = isAdmin ? '' : 'none';
  switchTab('overview');
}
function switchTab(t) {
  for (const x of ['overview', 'reports', 'versions', 'users']) {
    $('t-' + x).className = x === t ? 'on' : '';
    $('p-' + x).className = x === t ? '' : 'hidden';
  }
  if (t === 'overview') loadStats();
  if (t === 'reports') loadReports(1);
  if (t === 'versions') loadVersions();
  if (t === 'users') loadUsers();
}
async function loadStats() {
  const r = await api('/api/admin/stats');
  if (!r.data.ok) return;
  const v = r.data.activeVersion;
  $('stats').innerHTML =
    stat(r.data.reports, '缺陷报告总数') + stat(r.data.todayReports, '今日新报告') +
    stat(r.data.users, '注册用户') +
    stat(v ? 'v' + v.version : '—', '当前下发版本' + (v && v.note ? '<div class="sub">' + esc(v.note) + '</div>' : ''));
}
function stat(big, label) { return '<div class="stat"><b>' + big + '</b><span class="sub">' + label + '</span></div>'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- 报告 ---------- */
async function loadReports(page) {
  rPageNow = page || rPageNow;
  const q = $('rq').value.trim();
  const r = await api('/api/admin/reports?page=' + rPageNow + '&q=' + encodeURIComponent(q));
  if (!r.data.ok) return;
  const tb = $('rTable').querySelector('tbody');
  tb.innerHTML = (r.data.items || []).map((x) =>
    '<tr><td>' + new Date(x.created_at).toLocaleString() + '</td><td>' + (x.app_version ? 'v' + x.app_version : '—') +
    '</td><td class="sub">' + esc(x.ip) + '</td><td>' + esc(x.summary) + '</td>' +
    '<td><button class="ghost" onclick="showDetail(' + x.id + ')">详情</button> ' +
    '<button class="ghost" onclick="delReport(' + x.id + ')">删除</button></td></tr>'
  ).join('') || '<tr><td colspan="5" class="sub">暂无报告</td></tr>';
  $('rPage').textContent = '第 ' + r.data.page + ' / ' + Math.max(1, Math.ceil(r.data.total / r.data.size)) + ' 页，共 ' + r.data.total + ' 条';
}
function pageReports(d) { loadReports(Math.max(1, rPageNow + d)); }
async function showDetail(id) {
  const r = await api('/api/admin/reports/detail?id=' + id);
  if (!r.data.ok) return;
  const x = r.data.report;
  $('dTitle').textContent = new Date(x.created_at).toLocaleString() + (x.app_version ? ' · v' + x.app_version : '') + ' · ' + x.ip;
  $('dShot').innerHTML = x.has_screenshot ? '<img class="shot" src="/api/admin/reports/file?id=' + id + '&kind=screenshot" loading="lazy">' : '<div class="sub">无截图</div>';
  $('dText').textContent = r.data.text || '(无文本)';
  $('detailBox').className = 'card';
  $('detailBox').scrollIntoView({ behavior: 'smooth' });
}
function hideDetail() { $('detailBox').className = 'card hidden'; }
async function delReport(id) {
  if (!confirm('确定删除该报告？附件将一并删除。')) return;
  const r = await api('/api/admin/reports?id=' + id, { method: 'DELETE' });
  if (r.data.ok) { showMsg('msgMain', '已删除', true); loadReports(); setTimeout(() => $('msgMain').className = 'msg err hidden', 1500); }
}

/* ---------- 版本 ---------- */
async function loadVersions() {
  const r = await api('/api/admin/versions');
  if (!r.data.ok) return;
  const tb = $('vTable').querySelector('tbody');
  tb.innerHTML = (r.data.items || []).map((x) =>
    '<tr><td>v' + x.version + '</td><td>' + esc(x.note || '') + '</td><td>' + (x.size / 1048576).toFixed(1) + ' MB</td>' +
    '<td>' + new Date(x.created_at).toLocaleString() + '</td>' +
    '<td>' + (x.active ? '<span class="badge on">当前下发</span>' : '') + '</td>' +
    '<td>' + (x.active ? '' : '<button class="ghost" onclick="activateVersion(' + x.id + ')">设为下发版本</button>') + '</td></tr>'
  ).join('') || '<tr><td colspan="6" class="sub">暂无版本，先上传 APK</td></tr>';
}
async function uploadVersion() {
  const ver = $('vVer').value.trim();
  const note = $('vNote').value.trim();
  const f = $('vFile').files[0];
  if (!ver || !f) { showMsg('msgMain', '请填版本号并选择 APK 文件', false); return; }
  const fd = new FormData();
  fd.append('version', ver);
  fd.append('note', note);
  fd.append('apk', f);
  $('vUp').textContent = '上传中…';
  const r = await api('/api/admin/versions', { method: 'POST', body: fd });
  $('vUp').textContent = '';
  if (r.data.ok) { showMsg('msgMain', '已上传 v' + ver + '，可在列表设为下发版本', true); $('vVer').value = ''; $('vNote').value = ''; $('vFile').value = ''; loadVersions(); setTimeout(() => $('msgMain').className = 'msg err hidden', 2500); }
  else showMsg('msgMain', '上传失败：' + (r.data.error === 'version_exists' ? '该版本号已存在' : r.data.error || r.status), false);
}
async function activateVersion(id) {
  if (!confirm('设为下发版本后，所有 App 的自动更新都会拉这个版本，确认？')) return;
  const r = await api('/api/admin/versions/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  if (r.data.ok) { loadVersions(); loadStats(); }
}

/* ---------- 用户 ---------- */
async function loadUsers() {
  const r = await api('/api/admin/users');
  if (!r.data.ok) return;
  const tb = $('uTable').querySelector('tbody');
  tb.innerHTML = (r.data.items || []).map((x) =>
    '<tr><td>' + esc(x.email) + '</td><td>' + (x.role === 'admin' ? '<span class="badge admin">管理员</span>' : '用户') + '</td>' +
    '<td class="sub">' + new Date(x.created_at).toLocaleString() + '</td>' +
    '<td>' + (x.disabled ? '<span class="badge">已停用</span>' : '正常') + '</td>' +
    '<td><button class="ghost" onclick="updUser(' + x.id + ',{role:\'' + (x.role === 'admin' ? 'user' : 'admin') + '\'})">' + (x.role === 'admin' ? '降为用户' : '升为管理员') + '</button> ' +
    '<button class="ghost" onclick="updUser(' + x.id + ',{disabled:' + (x.disabled ? 0 : 1) + '})">' + (x.disabled ? '启用' : '停用') + '</button></td></tr>'
  ).join('');
}
async function updUser(id, patch) {
  const r = await api('/api/admin/users/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id }, patch)) });
  if (r.data.ok) loadUsers();
  else showMsg('msgMain', '操作失败：' + (r.data.error || r.status), false);
}
async function changePw() {
  const r = await api('/api/auth/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ old: $('pOld').value, new: $('pNew').value }) });
  if (r.data.ok) { showMsg('msgMain', '密码已修改', true); $('pOld').value = ''; $('pNew').value = ''; setTimeout(() => $('msgMain').className = 'msg err hidden', 2000); }
  else showMsg('msgMain', '修改失败：旧密码不正确或新密码少于8位', false);
}

/* ---------- 启动 ---------- */
initAuth().then(() => { switchAuth('login'); });
if (token) enterMain();
</script>
</body>
</html>
